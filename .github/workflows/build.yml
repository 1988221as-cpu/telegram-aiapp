name: GitHub Cloud Build Exe

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          if (Test-Path package-lock.json) { Remove-Item package-lock.json -Force }
          npm install --legacy-peer-deps
          npm install @rolldown/binding-win32-x64-msvc @libsql/win32-x64-msvc --save-optional --legacy-peer-deps

      - name: Build Web Frontend & Server
        run: npm run build

      - name: Install Electron & Electron Builder
        run: npm install electron@31.0.0 electron-builder@24.13.3 --save-dev --legacy-peer-deps

      - name: Package Windows App (.exe)
        run: npx electron-builder --win nsis portable --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Packaged Desktop Smoke Test
        run: |
          Write-Host "Verifying packaged executable via automated smoke test..."
          $preferredExe = "dist-electron/win-unpacked/HumanSense.exe"
          if (Test-Path $preferredExe) {
            $exePath = (Resolve-Path $preferredExe).Path
          } else {
            $foundExe = Get-ChildItem -Path "dist-electron/win-unpacked" -Filter "*.exe" -ErrorAction SilentlyContinue | Where-Object { $_.Name -notmatch "^Uninstall" } | Select-Object -First 1
            if (-not $foundExe) {
              Write-Host "::error::Executable not found in dist-electron/win-unpacked (expected HumanSense.exe)"
              exit 1
            }
            $exePath = $foundExe.FullName
          }
          Write-Host "Found packaged executable: $exePath"
          $proc = Start-Process -FilePath $exePath -ArgumentList @("--smoke-test", "--no-sandbox") -PassThru -NoNewWindow
          $finished = $proc.WaitForExit(35000)
          
          # Find log file dynamically under APPDATA
          $logFiles = Get-ChildItem -Path "$env:APPDATA" -Filter "main.log" -Recurse -ErrorAction SilentlyContinue
          $logText = ""
          foreach ($f in $logFiles) {
            Write-Host "Found log file at: $($f.FullName)"
            $logText += Get-Content $f.FullName -Raw
          }
          
          if ($logText) {
            Write-Host "--- Application Log ---"
            Write-Host $logText
            Write-Host "-----------------------"
          }

          if ($logText -match "SMOKE_TEST_SUCCESS" -or $proc.ExitCode -eq 0) {
            Write-Host "Smoke test PASSED! Application started successfully and backend health responded 200 OK."
            exit 0
          }

          if (-not $finished) {
            Stop-Process -Id $proc.Id -Force
            Write-Host "::error::Packaged app failed to reach healthy state within 35s!"
            exit 1
          }

          Write-Host "::error::Smoke test failed with exit code $($proc.ExitCode)"
          exit 1

      - name: Upload Artifacts (Downloadable Exe)
        uses: actions/upload-artifact@v4
        with:
          name: HumanSense-Windows-Installer
          path: |
            dist-electron/*.exe

      - name: Release Exe to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-electron/*.exe
            dist-electron/latest.yml
            dist-electron/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
